name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action needs this on pull_request events to fetch the PR's commit range

jobs:
  # ---------------------------------------------------------------------
  # T0/T1 gates that are REAL for Sprint 1 (ADR-010 / charter §20, C-04):
  # format, lint, type-check, unit tests, dependency scan (fail-closed),
  # secret scan, AI-authorship trailer check (PR events only). These must
  # be required status checks once branch protection can be enabled.
  # ---------------------------------------------------------------------

  lint-type-unit:
    name: lint-type-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff (lint + format check)
        run: ruff check . && ruff format --check .
      - name: mypy (type check)
        run: mypy
      - name: pytest (unit tests)
        run: pytest -q

  oracle-import-isolation:
    name: oracle-import-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Fail-closed oracle import graph
        run: |
          python scripts/check_import_isolation.py --root . --output /tmp/ts12-import-isolation.json
          diff --unified=0 packages/oracle/evidence/import-isolation.json /tmp/ts12-import-isolation.json
      - name: Oracle contract tests
        run: pytest -q tests/test_oracle.py

  wheel-clean-install:
    name: wheel-clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install -e ".[dev]"
      - name: Build wheel and verify isolated runtime imports
        run: python scripts/check_wheel_install.py

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeops_test
          POSTGRES_PASSWORD: tradeops_test
          POSTGRES_USER: tradeops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeops_test -d tradeops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRADEOPS_TEST_DATABASE_URL: postgresql://tradeops_test:tradeops_test@localhost:5432/tradeops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Fresh PostgreSQL migration and append-only tests
        run: pytest -q tests/integration

  product-e2e:
    name: product-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeops_product
          POSTGRES_PASSWORD: tradeops_product
          POSTGRES_USER: tradeops_product
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tradeops_product -d tradeops_product"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRADEOPS_TEST_DATABASE_URL: postgresql://tradeops_product:tradeops_product@localhost:5433/tradeops_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API + test dependencies
        run: pip install -e ".[dev]"
      - name: Product API and end-to-end tests
        run: pytest -q tests/integration/test_product_e2e.py

  docker-build-and-smoke:
    name: docker-build-and-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeops_smoke
          POSTGRES_PASSWORD: tradeops_smoke
          POSTGRES_USER: tradeops_smoke
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tradeops_smoke -d tradeops_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t tradeops-api:ci .
      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t tradeops-dashboard:ci .
      # Container startup smoke test: the API must come up, report healthy,
      # migrate the database and answer an authenticated request end to end.
      - name: API container startup smoke test
        run: |
          set -euo pipefail
          # Generated per run: no literal key is ever written into this file.
          SMOKE_KEY="$(openssl rand -hex 24)"
          echo "SMOKE_KEY=$SMOKE_KEY" >> "$GITHUB_ENV"
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL='postgresql://tradeops_smoke:tradeops_smoke@localhost:5434/tradeops_smoke' \
            -e TRADEOPS_API_KEY="$SMOKE_KEY" \
            tradeops-api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS http://localhost:8000/ready
          echo
          # authenticated call must succeed; unauthenticated must be rejected
          curl -fsS -H "X-API-Key: $SMOKE_KEY" http://localhost:8000/summary >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/summary)
          test "$code" = "401" || { echo "unauthenticated request was not rejected: $code"; exit 1; }
          echo "API container smoke test passed"
      - name: Dashboard container startup smoke test
        run: |
          set -euo pipefail
          docker run -d --name dash-smoke --network host \
            -e API_BASE_URL='http://localhost:8000' \
            -e TRADEOPS_API_KEY="$SMOKE_KEY" \
            tradeops-dashboard:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          echo "Dashboard container smoke test passed"
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs api-smoke || true
          docker logs dash-smoke || true

  ai-authorship-trailer-check:
    name: ai-authorship-trailer-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # actions/checkout defaults to the PR's synthetic merge ref
      # (refs/pull/<n>/merge) on pull_request events. That merge commit is
      # generated by GitHub itself and never carries trailers, so it always
      # shows up as a false failure in `origin/<base>..HEAD`. Check out the
      # PR's actual head commit instead so the range reflects only real,
      # human-authored commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Generated-by / Co-authored-by / Signed-off-by trailers
        run: |
          python scripts/check_ai_trailer.py origin/${{ github.base_ref }} HEAD
      # Deliberately part of this already-required job rather than a new one:
      # a separate job would not be enforced until it is added to the branch
      # protection required contexts, leaving the gap open in the meantime.
      - name: Check author/committer identity is not a placeholder address
        run: |
          python scripts/check_commit_identity.py origin/${{ github.base_ref }} HEAD

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (fail-closed — no bypass)
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit
          pip install -e ".[dev]"
          pip-audit

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # DISABLED gates — defined per ADR-010/charter §20 so the pipeline shape
  # is visible, but explicitly NOT enabled. A disabled job must never be
  # reported as passing evidence (owner's explicit instruction, and Fizz's
  # independent E1 review finding: a "success" no-op step still renders as
  # a green check, which is indistinguishable from a real pass — so these
  # two are now `if: false` like the others, not a job that runs and
  # trivially succeeds). Each is gated with the reason and the enabling
  # condition stated in a comment.
  # ---------------------------------------------------------------------

  evidence-manifest-completeness-DISABLED:
    name: evidence-manifest-completeness (disabled)
    runs-on: ubuntu-latest
    if: false # Enable once TS-15 (Epic E6) implements a real release_evidence manifest + completeness check. See docs/adr/README.md and CHARTER_REFERENCE.md §20/§29.
    steps:
      - run: echo "disabled"

  reconciliation-invariant-tests-DISABLED:
    name: reconciliation-invariant-tests (disabled)
    runs-on: ubuntu-latest
    if: false # Kept as a legacy named placeholder until TS-15 publishes the dedicated required check. The real invariant suite already runs inside lint-type-unit.
    steps:
      - run: echo "disabled"

  llm-evaluation-DISABLED:
    name: llm-evaluation (disabled)
    runs-on: ubuntu-latest
    if: false # Enable only once the constrained LLM workflow (ADR-004/007) is implemented (post-Sprint-1). Never report this as passing while disabled.
    steps:
      - run: echo "disabled"

  playwright-e2e-DISABLED:
    name: playwright-e2e-action-safety (disabled)
    runs-on: ubuntu-latest
    if: false # Enable only once packages/executor (ADR-011) and the mock legacy app exist. Playwright evidence proves the executor pattern only — never UiPath/cloud proof (charter C-03/SC-01).
    steps:
      - run: echo "disabled"

  cloud-terraform-DISABLED:
    name: cloud-terraform-plan (disabled)
    runs-on: ubuntu-latest
    if: false # Enable only if/when the optional cloud reference path (ADR-008 §22) is owner-approved. No cloud credential exists in this repo's secrets today.
    steps:
      - run: echo "disabled"

  uipath-DISABLED:
    name: uipath-integration (disabled)
    runs-on: ubuntu-latest
    if: false # Post-MVP only, pending a vendor quote (ADR-011). Must never run in Sprint 1.
    steps:
      - run: echo "disabled"
