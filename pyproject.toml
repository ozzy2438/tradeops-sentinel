[project]
name = "tradeops-sentinel"
version = "0.1.0"
description = "TradeOps Sentinel — Global Markets Trade-Break Automation & Regulatory Evidence Platform (reference implementation, synthetic data only)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tradeops_sentinel", "packages.contracts", "packages.generator"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=83.0.0"]  # >=83.0.0 required: fixes PYSEC-2026-3447
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
