[project]
name = "tradeops-sentinel"
version = "0.1.0"
description = "TradeOps Sentinel — Global Markets Trade-Break Automation & Regulatory Evidence Platform (reference implementation, synthetic data only)"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
]
dashboard = [
    "streamlit>=1.38",
    "httpx>=0.27",
    "pandas>=2.2",
]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "build>=1.2",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3.2",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
    "tradeops_sentinel",
    "packages.contracts",
    "packages.generator",
    "packages.persistence",
    "packages.reconciliation",
    "packages.oracle",
    "apps.api",
]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=83.0.0"]  # >=83.0.0 required: fixes PYSEC-2026-3447
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tradeops_sentinel*", "packages*"]
namespaces = true

[tool.setuptools.package-data]
"packages.contracts" = ["schemas/*.json", "examples/**/*.json"]
"packages.oracle" = ["evidence/*.json"]
"packages.persistence" = ["ddl/*.sql"]
"packages.reconciliation" = ["evidence/*.json"]
