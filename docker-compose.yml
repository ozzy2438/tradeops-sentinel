# TradeOps Sentinel — full product, one command:
#   docker compose up --build
#
# Neon is the database. No local PostgreSQL container is started: DATABASE_URL
# must point at your Neon `tradeops-dev` branch. Credentials come from .env,
# which is git-ignored and never baked into an image.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - see .env.example}
      TRADEOPS_API_KEY: ${TRADEOPS_API_KEY:?TRADEOPS_API_KEY is required - see .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRADEOPS_AUTO_MIGRATE: ${TRADEOPS_AUTO_MIGRATE:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_BASE_URL: http://api:8000
      TRADEOPS_API_KEY: ${TRADEOPS_API_KEY:?TRADEOPS_API_KEY is required - see .env.example}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
