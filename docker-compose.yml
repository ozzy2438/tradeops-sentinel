# TradeOps Sentinel — full product, one command:
#   docker compose up --build
#
# Neon is the database. No local PostgreSQL container is started: DATABASE_URL
# must point at your Neon `tradeops-dev` branch. Credentials come from .env,
# which is git-ignored and never baked into an image.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - see .env.example}
      TRADEOPS_API_KEY: ${TRADEOPS_API_KEY:?TRADEOPS_API_KEY is required - see .env.example}
      TRADEOPS_REMEDIATION_SIGNING_SECRET: ${TRADEOPS_REMEDIATION_SIGNING_SECRET:?TRADEOPS_REMEDIATION_SIGNING_SECRET is required - see .env.example}
      TRADEOPS_AI_PROVIDER: ${TRADEOPS_AI_PROVIDER:-deterministic}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5.4-mini}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_MAX_COMPLETION_TOKENS: ${AZURE_OPENAI_MAX_COMPLETION_TOKENS:-400}
      AZURE_OPENAI_REASONING_EFFORT: ${AZURE_OPENAI_REASONING_EFFORT:-minimal}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRADEOPS_AUTO_MIGRATE: ${TRADEOPS_AUTO_MIGRATE:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_BASE_URL: http://api:8000
      TRADEOPS_API_KEY: ${TRADEOPS_API_KEY:?TRADEOPS_API_KEY is required - see .env.example}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
